[package]
name = "nw-network-types"
version = "0.1.0"
edition = "2024"
description = "Generated data types used by nw-network."
license = "MIT OR Apache-2.0"
repository = "https://github.com/themixednuts/nw-network"

[dependencies]
arrayvec = { version = "0.7.7", features = ["serde"] }
bevy_color = { version = "0.19", features = ["serialize", "bevy_reflect"] }
bevy_math = { version = "0.19", features = ["serialize", "bevy_reflect"] }
bevy_reflect = { version = "0.19", features = ["smallvec", "uuid"] }
sha1 = "0.11"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde"] }
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }

[build-dependencies]
anyhow = "1"
blake3 = "1"
nw-resources = { git = "https://github.com/themixednuts/nw-tools.git", rev = "fafc9d1438cdb9f66c033968ee97c41b4ef2dabe" }
nw-serialize-codegen = { git = "https://github.com/themixednuts/nw-tools.git", rev = "fafc9d1438cdb9f66c033968ee97c41b4ef2dabe", default-features = false, features = ["network"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
